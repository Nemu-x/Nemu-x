# Renders the profile SVGs (metrics card + 3D contribution calendar) into the `output` branch.
name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Nemu-x
          filename: metrics.svg
          committer_branch: output
          committer_message: "chore: update metrics.svg"
          template: classic
          # repositories/languages need a PAT in METRICS_TOKEN; github.token only sees this repo
          base: header, activity, community
          config_timezone: Europe/Moscow
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - uses: actions/checkout@v7.0.1

      - name: 3D contribution calendar (dark)
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: Nemu-x
          SETTING_JSON: .github/3d-contrib/horde-dark.json

      - name: 3D contribution calendar (light)
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: Nemu-x
          SETTING_JSON: .github/3d-contrib/horde-light.json

      - name: Push calendar to output branch
        run: |
          git clone --depth 1 --branch output "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cp profile-3d-contrib/contrib-3d-*.svg out/
          cd out
          git rm -q --ignore-unmatch snake-*.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-3d-*.svg
          git diff --cached --quiet || git commit -m "chore: update 3d calendar"
          git push
